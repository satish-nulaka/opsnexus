version: '3.8'

services:
  taskflow-production:
    image: ${IMAGE_NAME:-taskflow-api}:${IMAGE_TAG:-latest}
    container_name: taskflow-prod-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=production-secret-key-sit753-that-is-over-256-bits-long
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge
