version: '3.8'

services:
  taskflow-staging:
    image: ${IMAGE_NAME:-taskflow-api}:${IMAGE_TAG:-staging}
    container_name: taskflow-staging-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - APP_VERSION=${IMAGE_TAG:-staging}
      - JWT_SECRET=staging-secret-key-sit753
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge
