version: '3.8'

services:
  opsnexus-staging:
    image: ${IMAGE_NAME:-opsnexus-api}:${IMAGE_TAG:-staging}
    container_name: opsnexus-staging-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=staging
      - JWT_SECRET=staging-secret-key-sit753-that-is-over-256-bits-long
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - taskflow-network

networks:
  taskflow-network:
    name: taskflow-network
    driver: bridge
