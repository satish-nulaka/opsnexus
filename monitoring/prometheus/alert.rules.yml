groups:
  - name: opsnexus_java_alerts
    rules:
      - alert: ServiceDown
        expr: up{job="opsnexus-production"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "OpsNexus Production Service is Down"
          description: "Production instance on port 8080 is unreachable."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[1m]) > 0.05
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx Error Rate Detected"
          description: "Error rate exceeded 5% on Spring Boot API."

      - alert: HighJvmHeapUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High JVM Heap Utilization"
          description: "JVM Heap usage exceeded 85%."
