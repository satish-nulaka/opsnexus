global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'taskflow-production'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000', 'taskflow-prod-app:3000']

  - job_name: 'taskflow-staging'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3001', 'taskflow-staging-app:3000']
