# SonarQube / SonarCloud Project Configuration for SIT223/SIT753 TaskFlow API
sonar.projectKey=sit753-taskflow-api
sonar.projectName=TaskFlow DevOps REST API
sonar.projectVersion=1.0.0

# Source & Test Code Layout
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Code Coverage & Execution Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results/junit.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/test-results/**
sonar.coverage.exclusions=**/tests/**,src/server.js

# Quality Gate Thresholds
sonar.qualitygate.wait=false
