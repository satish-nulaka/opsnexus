server:
  port: ${PORT:8080}

spring:
  application:
    name: opsnexus-api

# OpenAPI 3 / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
    display-request-duration: true
  show-actuator: true

# Spring Boot Actuator Configuration for DevOps Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Application Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:opsnexusdevopspipelinesupersecretkeythatislongerthan256bitsforhs256validation2026}
    expiration-ms: 86400000 # 24 hours
